[package]
name = "watf"
version = "0.1.0"
edition = "2021"
description = "what tf ? Offline CLI capability retrieval and grounded local planning"
license = "MIT"
keywords = ["cli", "offline", "search", "llm", "agent"]
categories = ["command-line-utilities"]

[features]
default = []
local-llm = ["dep:llama-cpp-2", "dep:llama-cpp-sys-2", "dep:encoding_rs"]
tui = ["dep:crossterm"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
memmap2 = "0.9"
flate2 = { version = "1.1", default-features = false, features = ["rust_backend"] }
sha2 = "0.10"
llama-cpp-2 = { version = "=0.1.156", optional = true, default-features = false }
llama-cpp-sys-2 = { version = "=0.1.156", optional = true, default-features = false }
encoding_rs = { version = "0.8", optional = true }
crossterm = { version = "0.29", optional = true, default-features = false, features = ["events"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "debuginfo"

[profile.dist]
inherits = "release"
lto = "fat"

[[bench]]
name = "retrieval"
harness = false
