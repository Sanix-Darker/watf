[package]
name = "watf"
version = "0.0.1"
edition = "2021"
rust-version = "1.88"
description = "Local CLI harness for agents with indexed validation and bounded execution"
license = "MIT"
repository = "https://github.com/Sanix-Darker/watf"
homepage = "https://watf.sanixdk.xyz"
documentation = "https://docs.rs/watf"
readme = "README.md"
keywords = ["cli", "offline", "search", "llm", "agent"]
categories = ["command-line-utilities"]
include = [
    "/Cargo.toml",
    "/Cargo.lock",
    "/README.md",
    "/CHANGELOG.md",
    "/LICENSE",
    "/src/**",
    "/data/core.jsonl",
]

[features]
default = []
local-llm = ["dep:llama-cpp-2", "dep:llama-cpp-sys-2", "dep:encoding_rs"]
tui = ["dep:crossterm"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
memmap2 = "0.9"
flate2 = { version = "1.1", default-features = false, features = ["rust_backend"] }
sha2 = "0.10"
llama-cpp-2 = { version = "=0.1.156", optional = true, default-features = false }
llama-cpp-sys-2 = { version = "=0.1.156", optional = true, default-features = false }
encoding_rs = { version = "0.8", optional = true }
crossterm = { version = "0.29", optional = true, default-features = false, features = ["events"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"

[profile.dist]
inherits = "release"

[[bench]]
name = "retrieval"
harness = false
