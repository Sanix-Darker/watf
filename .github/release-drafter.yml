name-template: v$RESOLVED_VERSION
tag-template: v$RESOLVED_VERSION
categories:
  - title: Features
    labels: [feature, enhancement]
  - title: Fixes
    labels: [fix, bug]
  - title: Maintenance
    labels: [maintenance, dependencies]
change-template: "- $TITLE (#$NUMBER) @$AUTHOR"
version-resolver:
  major:
    labels: [major]
  minor:
    labels: [feature, enhancement]
  patch:
    labels: [fix, bug, maintenance, dependencies]
  default: patch
template: |
  $CHANGES
