name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  linux-x86_64:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: rustfmt, clippy
          targets: x86_64-unknown-linux-musl
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
      - name: Install release tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends musl-tools binutils file
      - name: Verify tag and source
        run: |
          version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n1)"
          test "v${version}" = "$GITHUB_REF_NAME"
          cargo fmt --all -- --check
          cargo clippy --locked --all-targets --no-default-features -- -D warnings
          cargo test --locked --no-default-features --lib --bins --tests
          cargo package --locked
          cargo install --locked --path "target/package/watf-${version}" --root target/install-smoke
          test "$(target/install-smoke/bin/watf --version)" = "watf ${version}"
          python3 scripts/verify.py
      - name: Build and package
        env:
          SOURCE_DATE_EPOCH: "0"
        run: |
          binary=target/x86_64-unknown-linux-musl/dist/watf
          cargo build --locked --profile dist --no-default-features --target x86_64-unknown-linux-musl
          test "$(stat -c %s "$binary")" -le 2097152
          file "$binary" | grep -Eq 'ELF 64-bit.*x86-64'
          if readelf -lW "$binary" | grep -q 'INTERP'; then exit 1; fi
          if readelf -dW "$binary" | grep -q '(NEEDED)'; then exit 1; fi
          if readelf --version-info "$binary" | grep -q 'GLIBC_'; then exit 1; fi
          python3 scripts/smoke.py --binary "$binary"
          python3 scripts/package.py --binary "$binary" --flavor lite --target x86_64-unknown-linux-musl
          python3 scripts/source_archive.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-assets
          path: dist/*
          if-no-files-found: error

  publish:
    needs: linux-x86_64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-assets
          path: dist
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: dist/*
          generate_release_notes: true
