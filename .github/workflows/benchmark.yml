name: Benchmark

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - src/**
      - benches/**
      - Cargo.toml
      - Cargo.lock
      - data/**
      - examples/complex.jsonl

permissions:
  contents: read

jobs:
  retrieval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: mkdir -p reports
      - run: cargo bench --locked --bench retrieval > reports/bench-ci.json
      - uses: actions/upload-artifact@v4
        with:
          name: retrieval-benchmark
          path: reports/bench-ci.json
